server {
    listen 80;
    
    location / {
        return 200 '{"status":"healthy","service":"security"}';
        add_header Content-Type application/json;
    }
    
    location /login {
        return 200 '{"status":"success","token":"test-token"}';
        add_header Content-Type application/json;
    }
    
    location /metrics {
        return 200 '# HELP http_requests_total Total requests\n# TYPE http_requests_total counter\nhttp_requests_total{service="security"} 100\n';
        add_header Content-Type text/plain;
    }
}
