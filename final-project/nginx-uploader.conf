server {
    listen 80;
    
    location / {
        return 200 '{"status":"healthy","service":"uploader"}';
        add_header Content-Type application/json;
    }
    
    location /upload {
        return 200 '{"status":"success","file_id":"test-file"}';
        add_header Content-Type application/json;
    }
    
    location /metrics {
        return 200 '# HELP http_requests_total Total requests\n# TYPE http_requests_total counter\nhttp_requests_total{service="uploader"} 150\n';
        add_header Content-Type text/plain;
    }
}
